    <rect x="158" y="152" width="68" height="68" rx="12" fill="#7de7ff" fill-opacity="0.2"/>
    <rect x="246" y="152" width="62" height="22" rx="11" fill="#b04bff" fill-opacity="0.4"/>
    <rect x="246" y="190" width="42" height="22" rx="11" fill="#ffd26a" fill-opacity="0.35"/>
